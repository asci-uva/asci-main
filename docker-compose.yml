version: "3.3"

services:
  db:
    build:
      dockerfile: ./backend/docker/postgres/Dockerfile
    container_name: "ASCI_db"
    restart: on-failure
    ports:
      - 15432:5432
    environment:
      POSTGRES_USER: asci
      POSTGRES_PASSWORD: asci
      POSTGRES_DB: asci
      TZ: "America/New_York"
    volumes:
      - db-data:/var/lib/postgresql/data
  php:
    build:
      context: ./backend/
      dockerfile: ./docker/php/Dockerfile

    container_name: "ASCI_php"
    ports:
      - 8081:80
    volumes:
      - ./backend/src/asci/:/opt/src/asci/
      - ./backend/www/:/var/www/html/
      - ./backend/log/:/opt/log/
    depends_on:
      - db
      - chat

    environment:
      CANVAS_ENCRYPTION_KEY: asci
      TZ: "America/New_York"

  chat:
    build:
      context: ./llmserver/
      dockerfile: ./docker/Dockerfile

    container_name: "ASCI_chat"
    ports:
      - 8082:80
    volumes:
      - ./llmserver/src/ascillm/:/opt/src/ascillm/
      - ./llmserver/www/:/var/www/html/
      - ./llmserver/log/:/opt/log/
      - ./llmserver/data/:/opt/data/
    environment:
      TZ: "America/New_York"

  react:
    build:
      context: ./frontend/
      dockerfile: ./docker/Dockerfile

    environment:
      - CHOKIDAR_USEPOLLING=true

    volumes:
      - ./frontend/build/:/app/build/
      - ./frontend/src/:/app/src/
      - ./frontend/public/:/app/public/

    container_name: "ASCI_react"
    ports:
      - 3000:3000

  gradescope:
    build:
      context: ./gradescope/
      dockerfile: ./docker/Dockerfile

    container_name: "ASCI_gradescope"
    restart: on-failure
    ports:
      - 8083:80
    volumes:
      - ./gradescope/gradescope-api/src/:/app/src/
      - ./gradescope/log/:/opt/log/
    environment:
      TZ: "America/New_York"
volumes:
  db-data:
