version: '3.3'

services:
  db:
    build:
      dockerfile: ./backend/docker/postgres/Dockerfile
    container_name: 'ASCI_db'
    restart: on-failure
    ports:
      - 15432:5432
    environment:
      POSTGRES_USER: asci
      POSTGRES_PASSWORD: asci
      POSTGRES_DB: asci
    volumes:
      - ./db:/var/lib/postgresql/data
  php:
    build:
      context: ./backend/
      dockerfile: ./docker/php/Dockerfile

    container_name: 'ASCI_php'
    ports:
      - 8081:80
    volumes:
      - ./backend/src/asci/:/opt/src/asci/
      - ./backend/www/:/var/www/html/
      - ./backend/log/:/opt/log/
    depends_on:
      - db
